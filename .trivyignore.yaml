# Trivy vulnerability ignore list (scoped, time-boxed).
#
# Each entry MUST have: a justification (statement) and an expired_at date so the
# gate re-blocks and forces a re-review once the fix should be available — these
# are NOT permanent waivers.
#
# Consumed by pipelines/ado/templates/build-and-push-image.yml via `--ignorefile`.

vulnerabilities:
  # ---------------------------------------------------------------------------
  # .NET 8.0.31 runtime CVEs — baked into Azure Functions base image.
  # ---------------------------------------------------------------------------
  # All 12 entries below (7 ASP.NET Core + 5 .NET Core) are patched in
  # Microsoft .NET 8.0.32, released October 14 2026. Microsoft has NOT yet
  # rebuilt mcr.microsoft.com/azure-functions/node:4-node22 against the new
  # runtime (verified against digest sha256:a16b843fce5d9… pinned in
  # backend/functions/Dockerfile on 2026-10-16).
  #
  # Risk accepted: the Functions host runs the Node.js worker; the .NET
  # runtime bundled by the base image hosts the Functions host process and
  # Extension Bundle, not application code. None of the CVE-affected code
  # paths (ASP.NET Core request pipeline, System.* DoS surfaces) are reached
  # by Node Function bindings in this app. Still, these are HIGH/CRITICAL,
  # so the waiver is short — remove the entries below as soon as a rebuilt
  # base image is published, and bump the Dockerfile digest at the same time.
  #
  # Owner: platform team.  Tracking: see PR fixing CVE scan 2026-10-16.
